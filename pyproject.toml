[build-system]
requires = ["uv_build>=0.6.6,<0.7"]
build-backend = "uv_build"

[project]
name = "enverus-developer-api"
version = "5.0.0"
description = "Enverus Developer API Python Client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["enverus", "drillinginfo", "directaccess", "oil", "gas"]
authors = [
    { name = "Direct Access", email = "directaccess@enverus.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/enverus-ea/enverus-developer-api"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pymupdf>=1.26.7",
    "pymupdf4llm>=0.2.9",
    "ruff>=0.15.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
